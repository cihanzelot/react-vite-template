version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/vite"
      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
    # Major versions are deliberate decisions: dependabot only bumps within
    # the current major (minors, patches, and security fixes). Major upgrades
    # are done manually in chore/ branches.
    ignore:
      - dependency-name: "react"
        versions: ">=20"
      - dependency-name: "react-dom"
        versions: ">=20"
      - dependency-name: "@types/react"
        versions: ">=20"
      - dependency-name: "@types/react-dom"
        versions: ">=20"
      - dependency-name: "@types/node"
        versions: ">=25"
      - dependency-name: "tailwindcss"
        versions: ">=5"
      - dependency-name: "@tailwindcss/vite"
        versions: ">=5"
      - dependency-name: "vite"
        versions: ">=9"
      - dependency-name: "@vitejs/plugin-react"
        versions: ">=7"
      - dependency-name: "typescript"
        versions: ">=8"
      - dependency-name: "vitest"
        versions: ">=6"
      - dependency-name: "@vitest/coverage-v8"
        versions: ">=6"
      - dependency-name: "happy-dom"
        versions: ">=21"
      - dependency-name: "@testing-library/react"
        versions: ">=17"
      - dependency-name: "@testing-library/jest-dom"
        versions: ">=8"
      - dependency-name: "oxlint"
        versions: ">=2"
      - dependency-name: "oxfmt"
        versions: ">=1"
      - dependency-name: "oxlint-tsgolint"
        versions: ">=8"
      - dependency-name: "knip"
        versions: ">=7"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
